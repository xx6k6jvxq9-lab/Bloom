<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f472b6" />
    <meta name="application-name" content="Bloom" />
    <meta name="apple-mobile-web-app-title" content="Bloom" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>Bloom</title>
    <style>
      #boot-fallback[hidden] {
        display: none;
      }

      #boot-fallback {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #09090b;
        color: #f4f4f5;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }

      #boot-fallback-card {
        width: min(100%, 420px);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 24px;
        padding: 20px 18px;
        background: rgba(24, 24, 27, 0.94);
        box-shadow: 0 24px 48px rgba(0, 0, 0, 0.35);
      }

      #boot-fallback-title {
        margin: 0 0 8px;
        font-size: 18px;
        font-weight: 700;
      }

      #boot-fallback-copy {
        margin: 0;
        font-size: 14px;
        line-height: 1.7;
        color: rgba(244, 244, 245, 0.88);
      }

      #boot-fallback-detail {
        margin: 12px 0 0;
        font-size: 12px;
        line-height: 1.6;
        color: rgba(244, 244, 245, 0.55);
        word-break: break-word;
      }
    </style>
    <script>
      (function () {
        var bootWindow = window;

        function getBootMessage(state, reason) {
          if (state === 'file-protocol') {
            return {
              title: 'Bloom 无法直接从文件启动',
              copy:
                '当前页面看起来是通过本地文件打开的。Bloom 需要通过 http://localhost 或线上地址运行，直接双击 HTML 文件时模块脚本通常会被浏览器拦住。',
              detail: '',
            };
          }

          if (state === 'script-load') {
            return {
              title: 'Bloom 启动受阻',
              copy:
                '应用入口脚本没有成功加载。常见原因是直接用文件方式打开、资源路径不对，或当前浏览器容器拦截了模块脚本。',
              detail: reason ? '启动原因：' + reason : '',
            };
          }

          if (state === 'loading-timeout') {
            return {
              title: 'Bloom 还在启动中',
              copy:
                '首屏加载时间比平时更长。可能是首次缓存较多、设备较慢，或当前浏览器容器对部分能力支持不完整。可以再等一下，或刷新后重试。',
              detail: reason ? '当前状态：' + reason : '',
            };
          }

          return {
            title: 'Bloom 启动失败',
            copy:
              '应用在启动阶段遇到了兼容或运行问题。可以先刷新重试；如果仍然出现，再换系统浏览器或最新版 Chrome / Safari 打开。',
            detail: reason ? '启动原因：' + reason : '',
          };
        }

        function applyFallbackState(state, reason) {
          var fallback = document.getElementById('boot-fallback');
          if (!fallback) {
            return;
          }

          var title = document.getElementById('boot-fallback-title');
          var copy = document.getElementById('boot-fallback-copy');
          var detail = document.getElementById('boot-fallback-detail');
          var message = getBootMessage(state, reason);

          if (title) {
            title.textContent = message.title;
          }
          if (copy) {
            copy.textContent = message.copy;
          }
          if (detail) {
            if (message.detail) {
              detail.textContent = message.detail;
              detail.hidden = false;
            } else {
              detail.textContent = '';
              detail.hidden = true;
            }
          }

          fallback.hidden = false;
          fallback.setAttribute('data-state', state);
        }

        function revealFallback(state, reason) {
          if (bootWindow.__BLOOM_BOOTED__) {
            return;
          }

          applyFallbackState(state, reason);
        }

        function hideFallback() {
          var fallback = document.getElementById('boot-fallback');
          if (!fallback) {
            return;
          }

          fallback.hidden = true;
          fallback.removeAttribute('data-state');
        }

        var pendingBootResourceIssue = '';
        var pendingBootResourceType = '';
        var BOOT_RECOVERY_QUERY_PARAM = 'bloom_boot_retry';
        var BOOT_RECOVERY_TTL_MS = 30000;

        function getBootRecoveryStorageKey() {
          var pathname = '/';
          if (bootWindow.location && bootWindow.location.pathname) {
            pathname = bootWindow.location.pathname;
          }
          return 'bloom-boot-recovery:' + pathname;
        }

        function readBootRecoveryAttempt() {
          try {
            var raw = bootWindow.sessionStorage.getItem(getBootRecoveryStorageKey());
            if (!raw) {
              return null;
            }

            var parsed = JSON.parse(raw);
            if (!parsed || typeof parsed !== 'object') {
              return null;
            }

            return typeof parsed.at === 'number' && isFinite(parsed.at)
              ? {
                  at: parsed.at,
                  reason: parsed.reason ? String(parsed.reason) : '',
                }
              : null;
          } catch (_error) {
            return null;
          }
        }

        function hasRecentBootRecoveryAttempt() {
          var attempt = readBootRecoveryAttempt();
          return !!attempt && Date.now() - attempt.at < BOOT_RECOVERY_TTL_MS;
        }

        function rememberBootRecoveryAttempt(reason) {
          try {
            bootWindow.sessionStorage.setItem(
              getBootRecoveryStorageKey(),
              JSON.stringify({
                at: Date.now(),
                reason: reason ? String(reason) : '',
              }),
            );
          } catch (_error) {}
        }

        function isRecoverableBootMessage(message) {
          if (!message) {
            return false;
          }

          var normalized = String(message).toLowerCase();
          return (
            normalized.indexOf('failed to fetch dynamically imported module') !== -1 ||
            normalized.indexOf('error loading dynamically imported module') !== -1 ||
            normalized.indexOf('importing a module script failed') !== -1 ||
            normalized.indexOf('chunkloaderror') !== -1 ||
            normalized.indexOf('loading css chunk') !== -1 ||
            normalized.indexOf('unable to preload css') !== -1
          );
        }

        function buildBootRecoveryUrl() {
          try {
            var nextUrl = new URL(bootWindow.location.href);
            nextUrl.searchParams.set(BOOT_RECOVERY_QUERY_PARAM, String(Date.now()));
            return nextUrl.toString();
          } catch (_error) {
            return '';
          }
        }

        function shouldAttemptBootRecovery(issue) {
          if (!issue || bootWindow.__BLOOM_BOOTED__) {
            return false;
          }

          if (!bootWindow.location || bootWindow.location.protocol === 'file:') {
            return false;
          }

          if (hasRecentBootRecoveryAttempt()) {
            return false;
          }

          return issue.type === 'script' || issue.type === 'modulepreload' || issue.type === 'stylesheet';
        }

        function attemptBootRecovery(issue) {
          if (!shouldAttemptBootRecovery(issue)) {
            return false;
          }

          var nextUrl = buildBootRecoveryUrl();
          if (!nextUrl) {
            return false;
          }

          rememberBootRecoveryAttempt(issue.message || issue.type || 'boot-recovery');
          bootWindow.location.replace(nextUrl);
          return true;
        }

        function extractResourceIssue(event) {
          var target = event && event.target && event.target !== bootWindow ? event.target : null;
          if (!target) {
            return null;
          }

          var tagName = target.tagName ? String(target.tagName).toLowerCase() : '';
          if (tagName === 'script') {
            return {
              type: 'script',
              message: target.src || '入口脚本加载失败',
            };
          }

          if (tagName === 'link') {
            var rel = target.rel ? String(target.rel).toLowerCase() : '';
            if (rel === 'modulepreload') {
              return {
                type: 'modulepreload',
                message: target.href || '关键模块预加载失败',
              };
            }

            if (rel === 'stylesheet') {
              return {
                type: 'stylesheet',
                message: target.href || '关键样式资源加载失败',
              };
            }
          }

          return null;
        }

        function rememberResourceIssue(issue) {
          if (!issue) {
            return;
          }

          pendingBootResourceIssue = issue.message || '';
          pendingBootResourceType = issue.type || '';
        }

        function getPendingResourceIssueMessage() {
          if (!pendingBootResourceIssue) {
            return '';
          }

          if (pendingBootResourceType === 'modulepreload') {
            return '模块预加载失败：' + pendingBootResourceIssue;
          }

          if (pendingBootResourceType === 'stylesheet') {
            return '样式资源加载失败：' + pendingBootResourceIssue;
          }

          return pendingBootResourceIssue;
        }

        function isFatalResourceIssue(issue) {
          return !!issue && issue.type === 'script';
        }

        bootWindow.__BLOOM_SHOW_BOOT_FALLBACK__ = function (reason) {
          revealFallback('runtime-error', reason);
        };
        bootWindow.__BLOOM_HIDE_BOOT_FALLBACK__ = hideFallback;

        bootWindow.addEventListener(
          'error',
          function (event) {
            if (bootWindow.__BLOOM_BOOTED__) {
              return;
            }

            var resourceIssue = extractResourceIssue(event);
            if (resourceIssue) {
              rememberResourceIssue(resourceIssue);
              if (attemptBootRecovery(resourceIssue)) {
                return;
              }
              if (isFatalResourceIssue(resourceIssue)) {
                revealFallback('script-load', getPendingResourceIssueMessage());
              }
              return;
            }

            var message = event && event.message ? String(event.message) : '';
            if (isRecoverableBootMessage(message) && attemptBootRecovery({ type: 'script', message: message })) {
              return;
            }
            revealFallback(message ? 'runtime-error' : 'script-load', message || '入口脚本没有开始执行');
          },
          true,
        );

        bootWindow.addEventListener('unhandledrejection', function (event) {
          if (bootWindow.__BLOOM_BOOTED__) {
            return;
          }

          var reason = event && event.reason;
          var message = '';
          if (reason && typeof reason === 'object' && 'message' in reason && reason.message) {
            message = String(reason.message);
          } else if (reason) {
            message = String(reason);
          }
          if (isRecoverableBootMessage(message) && attemptBootRecovery({ type: 'script', message: message })) {
            return;
          }
          revealFallback('runtime-error', message);
        });

        bootWindow.__BLOOM_BOOT_ERROR_TIMEOUT__ = bootWindow.setTimeout(function () {
          if (bootWindow.__BLOOM_BOOTED__) {
            return;
          }

          if (bootWindow.location && bootWindow.location.protocol === 'file:') {
            revealFallback('file-protocol', '');
            return;
          }

          var pendingIssueMessage = getPendingResourceIssueMessage();

          if (!bootWindow.__BLOOM_BOOT_ENTRY_STARTED__) {
            if (
              attemptBootRecovery({
                type: pendingBootResourceType || 'script',
                message: pendingIssueMessage || '入口脚本没有开始执行',
              })
            ) {
              return;
            }

            if (pendingIssueMessage) {
              revealFallback('loading-timeout', pendingIssueMessage);
              return;
            }

            revealFallback('script-load', '入口脚本没有开始执行');
            return;
          }

          if (
            pendingIssueMessage &&
            attemptBootRecovery({
              type: pendingBootResourceType || 'script',
              message: pendingIssueMessage,
            })
          ) {
            return;
          }

          revealFallback('loading-timeout', pendingIssueMessage);
        }, 20000);
      })();
    </script>
  </head>
  <body>
    <div id="boot-fallback" hidden>
      <div id="boot-fallback-card">
        <h1 id="boot-fallback-title">Bloom 正在启动</h1>
        <p id="boot-fallback-copy">
          如果启动时间明显过长，页面会在这里显示更具体的原因。
        </p>
        <p id="boot-fallback-detail" hidden></p>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
