<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f472b6" />
    <meta name="application-name" content="Bloom" />
    <meta name="apple-mobile-web-app-title" content="Bloom" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>Bloom</title>
    <style>
      #boot-fallback[hidden] {
        display: none;
      }

      #boot-fallback {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #09090b;
        color: #f4f4f5;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }

      #boot-fallback-card {
        width: min(100%, 420px);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 24px;
        padding: 20px 18px;
        background: rgba(24, 24, 27, 0.94);
        box-shadow: 0 24px 48px rgba(0, 0, 0, 0.35);
      }

      #boot-fallback-title {
        margin: 0 0 8px;
        font-size: 18px;
        font-weight: 700;
      }

      #boot-fallback-copy {
        margin: 0;
        font-size: 14px;
        line-height: 1.7;
        color: rgba(244, 244, 245, 0.88);
      }

      #boot-fallback-detail {
        margin: 12px 0 0;
        font-size: 12px;
        line-height: 1.6;
        color: rgba(244, 244, 245, 0.55);
        word-break: break-word;
      }
    </style>
    <script>
      (function () {
        var bootWindow = window;

        function revealFallback(reason) {
          var fallback = document.getElementById('boot-fallback');
          if (!fallback) {
            return;
          }

          var detail = document.getElementById('boot-fallback-detail');
          if (detail) {
            if (reason) {
              detail.textContent = '启动原因：' + reason;
              detail.hidden = false;
            } else {
              detail.textContent = '';
              detail.hidden = true;
            }
          }

          fallback.hidden = false;
        }

        bootWindow.__BLOOM_SHOW_BOOT_FALLBACK__ = revealFallback;
        bootWindow.addEventListener('error', function (event) {
          if (bootWindow.__BLOOM_BOOTED__) {
            return;
          }

          revealFallback(event && event.message ? String(event.message) : '');
        });

        bootWindow.addEventListener('unhandledrejection', function (event) {
          if (bootWindow.__BLOOM_BOOTED__) {
            return;
          }

          var reason = event && event.reason;
          var message = '';
          if (reason && typeof reason === 'object' && 'message' in reason && reason.message) {
            message = String(reason.message);
          } else if (reason) {
            message = String(reason);
          }
          revealFallback(message);
        });

        bootWindow.__BLOOM_BOOT_ERROR_TIMEOUT__ = bootWindow.setTimeout(function () {
          var root = document.getElementById('root');
          var hasRenderedContent = !!(root && root.childNodes.length > 0);
          if (!bootWindow.__BLOOM_BOOTED__ && !hasRenderedContent) {
            revealFallback('');
          }
        }, 12000);
      })();
    </script>
  </head>
  <body>
    <div id="boot-fallback" hidden>
      <div id="boot-fallback-card">
        <h1 id="boot-fallback-title">Bloom 启动失败</h1>
        <p id="boot-fallback-copy">
          当前浏览器可能过旧，或脚本启动时遇到了兼容问题。可以优先尝试更新系统浏览器，或改用最新版 Chrome / Safari 后重新打开。
        </p>
        <p id="boot-fallback-detail" hidden></p>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
